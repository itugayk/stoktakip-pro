<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çevrimdışı — StokTakip Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b; color: #fafafa;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .icon {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #71717a; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem; border-radius: 8px;
      background: #6366f1; color: #fff; font-weight: 600; font-size: 0.9rem;
      border: none; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">ST</div>
    <h1>Çevrimdışısınız</h1>
    <p>İnternet bağlantınız yok görünüyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <a href="/" class="btn" onclick="location.reload(); return false;">Tekrar Dene</a>
  </div>
</body>
</html>
